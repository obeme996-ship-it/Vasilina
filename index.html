<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для Василины 💌</title>
<meta name="description" content="Маленький подарок для Василины: один вопрос, один правильный ответ и немного любви.">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:title" content="Для Василины 💌">
<meta property="og:description" content="Ответь на один вопрос, и откроется сюрприз.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Comfortaa', sans-serif;
    color: #6b1f3a;
    background: linear-gradient(160deg, #ffe3ec 0%, #ffc2d4 45%, #f7a1c0 100%);
    min-height: 100vh;
    overflow-x: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
  }
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .heart {
    position: absolute; bottom: -40px; color: rgba(255,255,255,.75);
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }
  .screen {
    position: relative; z-index: 1; width: 100%; max-width: 440px;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 28px; padding: 36px 26px;
    box-shadow: 0 20px 50px rgba(176, 40, 90, .25);
    text-align: center;
    animation: appear .7s ease both;
  }
  .hidden { display: none !important; }
  @keyframes appear { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: none; } }
  .big-heart { font-size: 46px; animation: beat 1.4s ease-in-out infinite; display: inline-block; }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  h1 {
    font-family: 'Marck Script', cursive; font-weight: 400;
    font-size: 40px; line-height: 1.15; margin: 10px 0 16px; color: #c2185b;
  }
  .question { font-size: 17px; line-height: 1.5; margin-bottom: 22px; font-weight: 600; }
  .question small { display: block; font-weight: 400; font-size: 14px; opacity: .75; margin-top: 4px; }
  input {
    width: 100%; font-family: inherit; font-size: 24px; text-align: center; letter-spacing: 2px;
    padding: 14px; border-radius: 16px; border: 2px solid #f4a6c1; background: #fff;
    color: #6b1f3a; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input:focus { border-color: #e91e63; box-shadow: 0 0 0 4px rgba(233,30,99,.15); }
  input.shake { animation: shake .45s; border-color: #b0003a; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  button {
    font-family: inherit; font-weight: 700; font-size: 17px; cursor: pointer;
    border: none; border-radius: 999px; padding: 14px 30px; margin-top: 18px;
    color: #fff; background: linear-gradient(135deg, #ff5c8a, #d81b60);
    box-shadow: 0 8px 20px rgba(216,27,96,.35); transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(216,27,96,.4); }
  button:active { transform: translateY(1px); }
  .toast {
    position: fixed; left: 50%; top: 24px; z-index: 10;
    transform: translate(-50%, -150%); transition: transform .4s cubic-bezier(.2,1.3,.4,1);
    background: #fff; color: #b0003a; font-weight: 700; font-size: 16px;
    padding: 14px 22px; border-radius: 16px; box-shadow: 0 12px 30px rgba(120,0,40,.25);
    border-left: 6px solid #e91e63; max-width: 92vw; text-align: center;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast span { display: block; font-weight: 400; font-size: 13px; color: #8a4560; margin-top: 4px; }

  .thanks h1 { font-size: 44px; }
  .stack {
    position: relative; width: 100%; max-width: 300px; aspect-ratio: 3 / 4;
    margin: 6px auto 0;
  }
  .photo {
    position: absolute; inset: 0; border-radius: 20px; overflow: hidden;
    border: 6px solid #fff; box-shadow: 0 14px 30px rgba(150,20,70,.3);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo.front { z-index: 2; transform: rotate(-2deg); opacity: 1; }
  .photo.back  { z-index: 1; transform: rotate(-2deg); opacity: 0; }
  .panel { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .sparkle { position: fixed; pointer-events: none; z-index: 20; font-size: 22px; animation: burst 1.2s ease-out forwards; }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) scale(.4); opacity: 0; } }
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="toast" id="toast">мда, Василина, я разочарован<span>Даю ещё одну попытку…</span></div>

<section class="screen" id="quiz">
  <div class="big-heart">💗</div>
  <h1>Маленький вопрос</h1>
  <p class="question">Когда мы начали встречаться?<small>(Напиши цифрами, например 01,01)</small></p>
  <form id="form" autocomplete="off">
    <input id="answer" inputmode="decimal" placeholder="__,__" maxlength="10">
    <button type="submit">Проверить 💌</button>
  </form>
</section>

    <button id="swap">Поменять фото 🔄</button>
  </div>
</section>

<script>
  // floating hearts
  const hearts = document.getElementById('hearts');
  const symbols = ['❤','♥','💕','💗','❥'];
  for (let i = 0; i < 22; i++) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = symbols[i % symbols.length];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (14 + Math.random() * 22) + 'px';
    h.style.animationDuration = (8 + Math.random() * 10) + 's';
    h.style.animationDelay = (-Math.random() * 18) + 's';
    hearts.appendChild(h);
  }

  const form = document.getElementById('form');
  const input = document.getElementById('answer');
  const toast = document.getElementById('toast');
  let toastTimer;

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const val = input.value.trim();
    if (val.split('').reverse().join('') === '01,12') {
      burst();
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('thanks').classList.remove('hidden');
    } else {
      input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
      input.value = '';
      input.focus();
    }
  });

  function burst() {
    const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = ['💖','💗','✨','💕'][i % 4];
      s.style.left = cx + 'px'; s.style.top = cy + 'px';
      const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 220;
      s.style.setProperty('--dx', Math.cos(a) * r + 'px');
      s.style.setProperty('--dy', Math.sin(a) * r + 'px');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1300);
    }
  }

  // swap photos
  document.getElementById('swap').addEventListener('click', () => {
    const front = document.querySelector('.photo.front');
    const back = document.querySelector('.photo.back');
    front.classList.replace('front', 'back');
    back.classList.replace('back', 'front');
  });
</script>
